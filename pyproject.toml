[build-system]
requires = ["scikit-build-core>=0.10", "torch>=2.4.0", "wheel"]
build-backend = "scikit_build_core.build"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
    "psutil>=7.2.2",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15.18",
]

[tool.scikit-build]
cmake.version = ">=3.26"
cmake.build-type = "Release"
# Cache the CMake build tree per wheel tag for fast incremental rebuilds.
build-dir = "build/{wheel_tag}"
# Ship the pure-Python package; CMake installs nanovllm/_C*.so alongside it.
wheel.packages = ["nanovllm"]
# Recompile the extension on import when csrc/ or CMakeLists.txt change.
editable.rebuild = true
editable.mode = "redirect"
minimum-version = "build-system.requires"

[tool.scikit-build.cmake.define]
CMAKE_CUDA_ARCHITECTURES = "90"

[tool.pyright]
# torch re-exports many symbols dynamically from torch._C._VariableFunctions
# (zeros, tensor, empty, arange, ones, randn, cat, stack, ...). basedpyright/
# cursorpyright cannot see the runtime __all__.extend(...) and flags every call
# site as reportPrivateImportUsage. Silence that one rule project-wide.
reportPrivateImportUsage = "none"
# basedpyright-only rule that demands explicit annotations on every instance
# attribute unless the class is @final. Too noisy for this codebase where
# attributes are obvious from their __init__ assignments.
reportUnannotatedClassAttribute = "none"

[tool.ruff]
# Match the project's existing style: longer lines than Black's default 88.
line-length = 100
# Lowest supported interpreter (see requires-python); keeps autofixes 3.10-safe.
target-version = "py310"

[tool.ruff.lint]
# Formatting-only setup: the formatter handles layout, and isort ("I") keeps
# import ordering consistent (Ruff's formatter intentionally leaves it alone).
# Add more rule families here later if you want linting too.
select = ["I"]

[tool.ruff.format]
# Defaults already match the codebase (double quotes, space indent). Also format
# code snippets inside docstrings so examples stay consistent.
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "gpu: requires a CUDA device",
]

[tool.uv]
no-build-isolation-package = ["flash-attn", "nano-vllm"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
